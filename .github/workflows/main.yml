name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        # The Ruby Atlas and Cerberus run. Ruby 3.0 is not built for the current
        # ubuntu-latest image, so setup-ruby 404s on it.
        ruby:
          - '3.4'

    steps:
    - uses: actions/checkout@v5
    # No bundler-cache: gem build and gem push need no bundle, and the
    # lockfile's Bundler 2.2.33 predates Ruby 3.4.
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Build and push the gem
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem build *.gemspec
        gem push *.gem
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_API_KEY}}"
